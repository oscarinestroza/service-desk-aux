{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools-items %}
{{ block.super }}

<li>
    <form method="post" action="{% url opts|admin_urlname:'changelist' %}">
        {% csrf_token %}
        <input type="hidden" name="action" value="exportar_todos_excel">
        <button type="submit" class="btn btn-high btn-info" style="display:inline-flex;align-items:center;gap:4px;">
            <i class="fas fa-file-excel"></i> Exportar todos a Excel
        </button>
    </form>
</li>

<li>
    <a href="{% url 'enlaces_ccg:importar_enlaces' %}" class="btn btn-high btn-success" style="display:inline-flex;align-items:center;gap:4px;">
        <i class="fas fa-file-import"></i> Importar desde Excel
    </a>
</li>
{% endblock %}
