<!DOCTYPE html>
<html lang="es-hn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Enlaces CCG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ccg-blue-darkest: #0a1628;
            --ccg-blue-dark: #0d1b3e;
            --ccg-blue-mid: #132d5e;
            --ccg-blue-accent: #1e3f7a;
            --ccg-blue-light: #2a5298;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--ccg-blue-darkest) 0%, var(--ccg-blue-dark) 40%, var(--ccg-blue-mid) 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* Fondo animado */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(42,82,152,.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 20%, rgba(30,63,122,.1) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-3%, 2%); }
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--ccg-blue-darkest), var(--ccg-blue-mid));
            padding: 2rem 2rem 1.5rem;
            text-align: center;
            color: #fff;
        }

        .login-header .logo-circle {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: rgba(255,255,255,.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            border: 2px solid rgba(255,255,255,.2);
        }

        .login-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            font-size: 0.78rem;
            opacity: 0.65;
            margin: 0;
        }

        .login-body {
            padding: 1.75rem 2rem 2rem;
        }

        .login-body .form-label {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #555;
            margin-bottom: 0.35rem;
        }

        .login-body .input-group {
            border-radius: 10px;
            overflow: hidden;
            border: 1.5px solid #e0e0e0;
            transition: border-color 0.2s;
        }

        .login-body .input-group:focus-within {
            border-color: var(--ccg-blue-light);
            box-shadow: 0 0 0 3px rgba(42,82,152,.12);
        }

        .login-body .input-group-text {
            background: #f8f9fa;
            border: none;
            color: #999;
            width: 46px;
            justify-content: center;
        }

        .login-body .form-control {
            border: none;
            padding: 0.7rem 0.75rem;
            font-size: 0.92rem;
        }

        .login-body .form-control:focus {
            box-shadow: none;
        }

        .btn-login {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--ccg-blue-mid), var(--ccg-blue-accent));
            color: #fff;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.02em;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, var(--ccg-blue-accent), var(--ccg-blue-light));
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(42,82,152,.35);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            padding: 0 2rem 1.5rem;
        }

        .login-footer a {
            color: var(--ccg-blue-light);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .alert-error {
            background: #fef2f2;
            color: #c0392b;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 0.6rem 0.85rem;
            font-size: 0.84rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Cuadrícula decorativa */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-circle">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1>Enlaces CCG</h1>
                <p>Centro Cívico Gubernamental de Honduras</p>
            </div>

            <div class="login-body">
                {% if error %}
                <div class="alert-error">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ error }}
                </div>
                {% endif %}

                <form method="post" autocomplete="off">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control"
                                   placeholder="Ingresa tu usuario" autofocus required
                                   value="{{ request.POST.username|default:'' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="Ingresa tu contraseña" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-right-to-bracket me-1"></i> Iniciar Sesión
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <a href="{% url 'enlaces_ccg:lista_enlaces' %}">
                    <i class="fas fa-arrow-left me-1"></i> Volver al sitio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
